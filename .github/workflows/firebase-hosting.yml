name: CI

on:
  push:
    branches: [main]
  # Verify pull requests too. Before #114 nothing ran on a PR at all, so a branch could
  # only be found broken after it had already merged and deployed.
  pull_request:

jobs:
  # Fast feedback: types and pure-logic tests, no browser and no build.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `next build` type-checks only what the app actually imports, so a spec file that
      # does not even parse still produces a green build — main shipped exactly that once.
      # `tsc` covers e2e/ and the unit tests too (#133).
      - run: npm run typecheck

      - run: npm run test:unit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only: playwright.config.ts declares a single chromium project, and the
      # emulator-backed firebase-roundtrip project stays off unless FIREBASE_ROUNDTRIP=true.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The emulator-backed suite: real Firestore persistence, cross-session sync, the #74
  # lost-update regression — and the only coverage `firestore.rules` has anywhere. None of
  # it ran in CI before #119, so the security rules were validated by nothing.
  test-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Firestore emulator is a Java process. ubuntu-latest ships a JDK today, but
      # pinning one keeps the job from breaking the day that image stops doing so.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # firebase-tools is a devDependency and e2e/emulator-setup.ts resolves it from
      # node_modules/.bin, so there is no global CLI to install here.
      - run: npm run test:firebase

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-emulator
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-and-deploy:
    # The gate: a red suite must never reach the live channel. Without this the deploy
    # ran on nothing but a successful compile (#114).
    needs: [unit, test, test-emulator]
    # Only a merge to main deploys. A pull request must never publish to production, and
    # fork PRs cannot read the service-account secret anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTEDUDE2 }}
          channelId: live
          projectId: notedude2

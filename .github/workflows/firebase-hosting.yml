name: CI

on:
  push:
    branches: [main]
  # Verify pull requests too. Before #114 nothing ran on a PR at all, so a branch could
  # only be found broken after it had already merged and deployed.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only: playwright.config.ts declares a single chromium project, and the
      # emulator-backed firebase-roundtrip project stays off unless FIREBASE_ROUNDTRIP=true.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-and-deploy:
    # The gate: a red suite must never reach the live channel. Without this the deploy
    # ran on nothing but a successful compile (#114).
    needs: test
    # Only a merge to main deploys. A pull request must never publish to production, and
    # fork PRs cannot read the service-account secret anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Two products, two builds, one hosting project (#151). Both builds write to `out/`,
      # so each is deployed before the next overwrites it — never reorder these into
      # build, build, deploy, deploy.

      - name: Build notedude
        run: npm run build

      - name: Deploy notedude
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTEDUDE2 }}
          channelId: live
          projectId: notedude2
          target: notedude

      # NEXT_PUBLIC_* values are inlined at build time, so the previous build's output must
      # not be reused for a different variant.
      - name: Clear the build cache between variants
        run: rm -rf .next out

      - name: Build todude
        run: npm run build:todude

      # Requires a one-time `firebase hosting:sites:create todude`; this step fails loudly
      # until that exists rather than skipping, which would read as a successful deploy.
      # The notedude deploy above has already completed, so production is unaffected.
      - name: Deploy todude
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTEDUDE2 }}
          channelId: live
          projectId: notedude2
          target: todude
